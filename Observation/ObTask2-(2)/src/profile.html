<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Generator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">
        <h1>Student Profile Generator</h1>

        <form id="studentForm">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="rollNo">Roll No</label>
            <input type="text" id="rollNo" placeholder="Enter your roll number" required>

            <label for="department">Department</label>
            <input type="text" id="department" placeholder="Enter your department" required>

            <label for="cgpa">CGPA</label>
            <input type="number" id="cgpa" step="0.01" min="0" max="10"
                   placeholder="Enter your CGPA" required>

            <button type="submit">Generate Profile</button>

        </form>

        <!-- Profile will be generated here -->
        <div id="profileContainer"></div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
